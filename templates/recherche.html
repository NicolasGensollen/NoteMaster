{% extends "base.html" %}
{% block contenu %}
<h1>Recherche d'élèves</h1>
<form class="recherche">
  <label>Chercher un élève <input name="q" value="{{ q }}" placeholder="Nom ou prénom"></label>
  <button type="submit">Chercher</button>
</form>
{% if message %}<p class="aide">{{ message|safe }}</p>{% endif %}
<ul class="resultats">
{% for e in eleves %}
  <li><a href="{{ url_for('notes_eleve', eleve_id=e.id) }}">{{ e.prenom }} {{ e.nom }}</a></li>
{% endfor %}
</ul>
<p><a href="{{ url_for('espace_prof') }}">Retour à mes évaluations</a></p>
{% endblock %}
